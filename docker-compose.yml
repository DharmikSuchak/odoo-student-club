# docker-compose.yml — Student Club Platform local development
#
# Startup:
#   cp .env.example .env          # fill in JWT_SECRET at minimum
#   docker compose up -d          # starts all services
#   docker compose logs -f server # tail API logs
#
# First-run notes:
#   • The mongo-init service runs once to configure the rs0 replica set.
#     It exits 0 on success; subsequent starts are idempotent.
#   • The server and client services wait for their deps via healthchecks.
#
# Common recovery steps:
#   • "MongoServerError: not primary"
#       docker compose restart mongo && docker compose restart mongo-init
#   • Wipe ALL data (destructive):
#       docker compose down -v
#   • Rebuild images after dependency changes:
#       docker compose build --no-cache server client
#   • Force replica-set re-init without wiping data:
#       docker compose run --rm mongo-init

services:
  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    # --replSet enables the replica set; required for multi-document transactions.
    # --bind_ip_all allows connections from other containers.
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "db.adminCommand('ping').ok",
          '--host',
          'localhost:27017',
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ── Mongo replica-set init (runs once, then exits) ───────────────────────────
  mongo-init:
    image: mongo:7.0
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/mongo-rs-init.sh:/docker-entrypoint-initdb.d/mongo-rs-init.sh:ro
    entrypoint: ['/bin/bash', '/docker-entrypoint-initdb.d/mongo-rs-init.sh']

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # Append-only persistence (safe ephemeral store — AOF disabled intentionally
    # since Redis is ephemeral by design; see docs/architecture.md §5).
    command: redis-server --appendonly no --save ""

  # ── Server ───────────────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      # Override connection URLs to use Docker service names (not localhost)
      MONGO_URI: mongodb://mongo:27017/student_club?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '-O-', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    develop:
      watch:
        - action: sync+restart
          path: ./apps/server/src
          target: /app/apps/server/src

  # ── Client (React + Vite dev server) ─────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - '5173:5173'
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ''  # empty → uses Vite proxy (see vite.config.ts)
      VITE_PROXY_TARGET: 'http://server:3001' # Used by vite.config.ts proxy
    depends_on:
      server:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/client/src
          target: /app/apps/client/src

volumes:
  mongo_data:
  mongo_config:
  redis_data:
