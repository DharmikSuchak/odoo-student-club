name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancel in-progress runs when a new push lands on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ──────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (API)
        run: npm run lint -w apps/api

      - name: Run ESLint (Web)
        run: npm run lint -w apps/web

      - name: Check formatting (Prettier)
        run: npm run format:check

  # ── Type check ────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript — API
        run: npm run typecheck -w apps/api

      - name: TypeScript — Web
        run: npm run typecheck -w apps/web

  # ── Tests ─────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    # Tests that require MongoDB/Redis are mocked; no external services needed
    # for the scaffold. Integration tests will add service containers in Phase 1.
    env:
      NODE_ENV: test
      CLIENT_ORIGIN: http://localhost:5173
      MONGO_URI: mongodb://localhost:27017/test?replicaSet=rs0
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_secret_long_enough_for_zod_32characters
      JWT_EXPIRES_IN: 1h
      PORT: '3001'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests — API
        run: npm test -w apps/api

      - name: Run tests — Web
        run: npm test -w apps/web

  # ── Build ─────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    env:
      NODE_ENV: production
      CLIENT_ORIGIN: http://localhost:5173
      MONGO_URI: mongodb://localhost:27017/student_club?replicaSet=rs0
      REDIS_URL: redis://localhost:6379
      # JWT_SECRET is not needed at build time; zod validation runs at runtime.
      # We set a placeholder so tsc / vite don't error on missing env refs.
      JWT_SECRET: placeholder_not_used_at_build_time_32chars
      JWT_EXPIRES_IN: 7d
      PORT: '3001'
      VITE_API_BASE_URL: ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build — API
        run: npm run build -w apps/api

      - name: Build — Web
        run: npm run build -w apps/web
